  - article [ref=f18e27]:
    - heading "Privacy Policy" [level=1] [ref=f18e28]
    - generic [ref=f18e29]:
      - paragraph [ref=f18e30]: This Privacy Policy presents the process of collecting and using personal data, as well as the safeguard and security measures adopted in the treatment of such data. S317 Consulting recognises the importance of privacy and we ask you to carefully read this Privacy Policy to know how your Personal Information will be handled when using our website. The website www.theequatorcompany.com is owned by S317 Consulting, LDA. with headquarters at Rua Laura Alves nº12, 6º andar, 1050-041 Lisboa, Portugal.
      - paragraph [ref=f18e31]
      - paragraph [ref=f18e32]:
        - strong [ref=f18e33]: 1. Data collection
      - paragraph [ref=f18e34]: Whenever it is necessary to collect personal information, the use of this information will be carried out in compliance with the applicable legislation in force for the Data Protection Policy imposed by the National Data Protection Commission (CNPD), to ensure the confidentiality and security of personal data provided.
      - paragraph [ref=f18e35]: The collection of personal data (name, email address, telephone contact), is applicable in commercial consultations and/or service agreements. The entity responsible for the collection and processing of personal data is S317 Consulting.
      - paragraph [ref=f18e36]
      - paragraph [ref=f18e37]:
        - strong [ref=f18e38]: 2. Use of the information collected
      - paragraph [ref=f18e39]: S317 Consulting undertakes to comply with the rules of personal data processing in force in Portugal.
      - paragraph [ref=f18e40]: The data collected data is exclusively for the use of S317 Consulting, being guaranteed the privacy and protection of the data of the users.
      - paragraph [ref=f18e41]
      - paragraph [ref=f18e42]:
        - strong [ref=f18e43]: 3. Right of Access, Rectification, Cancellation, and Opposition
      - paragraph [ref=f18e44]:
        - text: "In accordance with the provisions of the law in force, any person may request access to their personal data, its content, as well as require its rectification, update or request its destruction, by written request addressed to S317 Consulting to the email address:"
        - link "info@s317consulting.com" [ref=f18e45] [cursor=pointer]:
          - /url: mailto:info@s317consulting.com
        - text: .
      - paragraph [ref=f18e46]
      - paragraph [ref=f18e47]:
        - strong [ref=f18e48]: 4. Security and Data Protection
      - paragraph [ref=f18e49]: S317 Consulting undertakes to treat your Personal Information with the utmost privacy, confidentiality, and security and undertakes to adopt the necessary security measures to ensure the safeguarding of the personal data of users against their possible misuse or against access not authorised.
      - paragraph [ref=f18e50]: Notwithstanding, and since the Internet is not 100% secure, S317 Consulting cannot guarantee the security of any information it disseminates online, nor be liable for any loss or damage caused to the user as a consequence of the loss of confidentiality of the information.
      - paragraph [ref=f18e51]
      - paragraph [ref=f18e52]:
        - strong [ref=f18e53]: 5. Responsibility
      - paragraph [ref=f18e54]: On this web page, users will be able to find links that take them to other web pages outside the domain of S317 Consulting servers that may themselves collect data or request personal information. This Privacy Policy does not apply to third-party sites, so you should read the Privacy Policy of the third-party sites you visit, and we are not responsible for the content and information on those same sites.
      - paragraph [ref=f18e55]
      - paragraph [ref=f18e56]:
        - strong [ref=f18e57]: 5. Privacy Policy Agreement
      - paragraph [ref=f18e58]: It is understood that the user accepts the conditions of this privacy policy when entering their data.
      - paragraph [ref=f18e59]: We assume that the user consents to the automated processing and use of the data in accordance with the privacy conditions described in this document wData Trehen filling out the forms. If you do not accept the terms and conditions of this Privacy Policy, we ask you not to provide any personal information to S317 Consulting through this site.
      - paragraph [ref=f18e60]
      - paragraph [ref=f18e61]:
        - strong [ref=f18e62]: 5. Changes to the Privacy Policy
      - paragraph [ref=f18e63]: S317 Consulting reserves the right at any time to update or revise this Privacy Policy in order to adjust it to any legislative changes and/or other constraints. Any changes made will be published in this space, so the user should visit this area frequently to keep informed about the Privacy Policy in force.
      - paragraph [ref=f18e64]
      - heading "Data Treatment" [level=2] [ref=f18e65]
      - paragraph [ref=f18e66]: "The Management determines that data processing must be subject to the following principles (data protection policy):"
      - paragraph [ref=f18e67]: a) determination, before data collection, of the purposes for their use, as well as their conservation and elimination;
      - paragraph [ref=f18e68]: b) identification of data subjects (personal and non-personal) and determination of their interests and rights;
      - paragraph [ref=f18e69]: c) provision of information to the holders of personal data on the specific purposes for the use, limitation, and interruption of use, rectification and conservation, deletion of data and right of opposition, when the holders are not aware of the information;
      - paragraph [ref=f18e70]: d) obtaining authorisation from the holder of personal data for their use, especially when they are or may be used for the purpose of offering goods and services, even if free of charge, or for analysing and controlling their behaviour;
      - paragraph [ref=f18e71]: e) interruption of the processing of data that no longer meet the purposes for which they were collected or when requested by their holders;
      - paragraph [ref=f18e72]: f) deletion of data when they are not used or at the request of their holders, subject to the applicable legal/fiscal permissions.
      - paragraph [ref=f18e73]: g) data protection through logical, physical, and other security measures.
      - paragraph [ref=f18e74]: These principles apply to data collected directly (personal and phone contacts) or indirectly (postal correspondence, own internet sites, and social networks), either in verbal and/or written forms (registration/information forms; postal mail, advertising, emails, posts, and others).
      - paragraph [ref=f18e75]: The Management determines that all data held and kept by the organisation must be treated lawfully, loyally, and transparently, within the principles of security and responsibility referred to above in this section and in the “Information Assets”.
      - paragraph [ref=f18e76]: "The data collected from its holders and kept by the organisation is structured accordingly to “Mapping the Value Network: Transactions”."
      - paragraph [ref=f18e77]: The company does not appoint any Data Protection Officer, as there is no need for regular and systematic control of the data based on their nature, scope, and purpose, as well as the small scale of the data collected and stored.
      - paragraph [ref=f18e78]: This policy was approved by the Managing Partners of S317 Consulting on March 17, 2021.
