      - generic [ref=e221] [cursor=pointer]:
        - heading "Social & Communities" [level=3] [ref=e223]
        - paragraph [ref=e225]: We create human impact. We help engage communities, promote inclusion and manage sustainable and social investments that generate lasting shared value.
      - generic [ref=e230] [cursor=pointer]:
        - heading "Waste & Circular Economy" [level=3] [ref=e232]
        - paragraph [ref=e234]: We embed circularity into core business processes and operations. We help organisations shift from linear to circular thinking — implementing circular models, reducing waste, accelerating industrial renewal and driving long-term resilience.
