  - generic [ref=e248]:
    - heading "Trusted by those driving change" [level=2] [ref=e249]
    - region "Gallery" [ref=e251]:
      - list [ref=e253]:
        - listitem [ref=e254]:
          - generic [ref=e255] [cursor=pointer]:
            - heading "Forests, Carbon, and Natural Capital" [level=3] [ref=e256]
            - img "Forests, Carbon, and Natural Capital" [ref=e259]
            - paragraph [ref=e265]: We support governments and companies in reforestation and conservation programs, such as the 550,000-hectare project in Malawi developed with Mamaland (Mota-Engil), which generates high-quality carbon credits. We work with E-Redes on natural capital assessment and biodiversity impact optimization, transforming ecosystems into strategic assets for a regenerative economy.
        - listitem [ref=e266]:
          - generic [ref=e267] [cursor=pointer]:
            - heading "Energy and Energy Efficiency" [level=3] [ref=e268]
            - img "Energy and Energy Efficiency" [ref=e271]
            - paragraph [ref=e277]: We support EDP in developing and implementing renewable generation solutions including solar, wind and hydro, integrated with energy efficiency and e-mobility. Through the Effizency platform, we help utilities deliver more competitive and scalable products for both B2C and B2B markets. We also work on designing and implementing energy infrastructure for cities, industry and government, covering project management, carbon services, financing, marketing and market intelligence.
        - listitem [ref=e278]:
          - generic [ref=e279] [cursor=pointer]:
            - heading "Consumer Goods and Social Impact" [level=3] [ref=e280]
            - img "Consumer Goods and Social Impact" [ref=e283]
            - paragraph [ref=e289]: We support leading retailers and consumer brands in creating social and environmental value. With SONAE MC, we developed the Missão Continente programme, which supports 900,000 people and was recognised with the 2023 European Excellence Award. We also work with major foundations and international organisations to design and implement social responsibility and circular economy policies across Europe, Asia and Africa.
        - listitem [ref=e290]:
          - generic [ref=e291] [cursor=pointer]:
            - heading "Water, Sanitation, and Resilient Cities" [level=3] [ref=e292]
            - img "Water, Sanitation, and Resilient Cities" [ref=e295]
            - paragraph [ref=e301]: We develop climate-resilient plans and infrastructure, including the Lisbon General Drainage Plan and the Luanda Water Master Plan (2025–2045). In Portugal, we support frontier innovation in water systems. In countries such as Brazil, Angola, Mozambique, Ethiopia, Cape Verde, Malawi, Nigeria and Tanzania, we promote universal access to water and sanitation, sustainable urban drainage and integrated water resource management.
        - listitem [ref=e302]:
          - generic [ref=e303] [cursor=pointer]:
            - heading "Resilience and Impact" [level=3] [ref=e304]
            - img "Resilience and Impact" [ref=e307]
            - paragraph [ref=e313]: We assess the resilience and impact of infrastructure projects across multiple sectors, analyzing climate, economic and social risks. We develop methodologies that integrate territorial vulnerability and operational continuity, guiding investment and planning decisions. For example, we have carried out climate risk assessments for critical assets such as roads, airports and ports — including the Dallas Airport — strengthening the adaptability and safety of essential infrastructure.
