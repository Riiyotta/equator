        - heading "Sustainability Strategy" [level=3] [ref=e169]
        - paragraph [ref=e171]: We design ESG strategies, implement financially sustainable action plans, ensure transparency and compliance, and mobilize stakeholders — driving sustainable growth, resilience, and measurable value for your business.
      - generic [ref=e176] [cursor=pointer]:
        - heading "Energy, Carbon & Biodiversity" [level=3] [ref=e178]
        - paragraph [ref=e180]: We help you lead the energy transition. We design sustainable solutions, networks and hybrid systems, structure finance mechanisms, conduct environmental audits and support carbon credits certification.
      - generic [ref=e185] [cursor=pointer]:
        - heading "Impact & Risks" [level=3] [ref=e187]
        - paragraph [ref=e189]: Integrate sustainability into your risk management and investment decisions. We assess impacts, compliance, and risk mitigation to strengthen your organizational resilience.
      - generic [ref=e194] [cursor=pointer]:
        - heading "Water & Sanitation" [level=3] [ref=e196]
        - paragraph [ref=e198]: We promote sustainable investment in resilient infrastructure. We provide technical assistance, apply Nature-Based Solutions and ensure efficiency, safety and resilience in water and wastewater systems.
